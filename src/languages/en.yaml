  TOOLTIP:
    portrait: Portrait image.<br>Click to edit (may need permissions).
    pcName: 캐릭터 이름

    pcAbility: |
      Ability Scores (or <b>Abilities</b>) are distributed during character creation to fit the character you want to portray and can be increased upon reaching certain levels. The <b>Modifier</b> (or <b>Mod</b>) is derived from this value. The character level acts as a bonus.
    pcAbilitySuffix: |
      Click to roll a <b>Skill Check</b> based on this ability. You can optionally apply a <b>Background</b> and <b>Situational Bonus</b> in the roll dialog.
    pcBackground: |
      {desc}
      Backgrounds represent pieces of a character's history and experience.
      It helps to keep Backgrounds broad enough to encompass multiple skills while being specific enough to connect your character to the world – to a region, faction, people or goal.
      The sheet options can be used to hide unused backgrounds or to add more.
      Click the die icon to roll a check based on this background. You can choose which <b>Ability</b> to use and optionally apply a <b>Situational Bonus</b> in the roll dialog.
    pcHitpoints: |
      HP(체력). 캐릭터의 클래스·능력치에 따라 산정됩니다.
    pcInitiative: |
      이니셔티브. 전투에서 행동 순서를 정하는 굴림입니다.
      클릭해 굴림 (Foundry 전투 트래커에 인카운터가 있어야 합니다).
    macroEditorHint: |
      <p>Use the field below to write a macro that executes when the power is used. Available variables are:</p>
      <ul>
        <li><strong>speaker</strong>: User activating the item.</li>
        <li><strong>actor</strong>: Actor that owns the item.</li>
        <li><strong>token</strong>: Active token for the actor that owns the item.</li>
        <li><strong>archmage</strong>: System-specifc data you can modify to implement custom automation that overrides the system's own.</li>
      </ul>
    activeEffectsItemHint: |
      Active Effects will not be applied directly to this item's parent actor, but they will show up as draggable effects on power cards in chat messages.
    actionAttackHint: |
      For ranged attacks, include either "R:" or "C:" in the action's name, above. For targeting, include possible targets in parentheses at the end of the attack line, such as "[[d20+9]] vs AC ([[d3]] nearby enemies)".
