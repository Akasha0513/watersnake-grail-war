  # Settings
  SETTINGS:
    groups:
      automation: Automation
      general: General
    initiativeDexTiebreakerName: 이니셔티브 동점 시 보정치로 판정
    initiativeDexTiebreakerHint: 이니셔티브가 같으면 이니셔티브 보정치가 높은 쪽이 먼저 행동합니다. 끄면 NPC가 우선합니다.
    initiativeStaticNpcName: NPC 이니셔티브 고정(10)
    initiativeStaticNpcHint: NPC(일반인·마술사)는 이니셔티브를 굴리지 않고 10으로 고정합니다.
    RoundUpDamageApplicationName: 피해·회복 적용 시 올림(끄면 내림)
    RoundUpDamageApplicationHint: 채팅 우클릭 메뉴로 ¼·½·1.5배 피해/회복을 적용할 때 소수점을 올림합니다. 끄면 내림합니다.
    allowTargetDamageApplicationName: 대상 지정 토큰에도 피해 적용 허용
    allowTargetDamageApplicationHint: 피해 적용 메뉴에 '선택 토큰' 외에 '대상 지정 토큰' 옵션을 추가합니다. 대상 지정에는 권한이 필요 없으니 주의하세요.
    allowRerollsName: 플레이어 재굴림 허용
    allowRerollsHint: GM이 아닌 플레이어도 채팅 메뉴에서 자신의 굴림을 다시 굴릴 수 있습니다. GM은 항상 가능합니다.
    gradeCheckDefaultName: 판정 시 영령의 급 기본 적용
    gradeCheckDefaultHint: 판정 대화상자의 '영령의 급' 수정치를 켠 상태로 시작합니다. 끄면 해제된 상태로 시작하며, 대화상자에서 판정마다 켤 수 있습니다.
    roundNoticeName: 라운드 시작 알림
    roundNoticeHint: 전투에서 새 라운드가 시작될 때 라운드·전투 고조 배너를 채팅에 출력합니다.
    concealAnimationName: 정보 은폐 글자 연출
    concealAnimationHint: 정보 은폐 효과가 걸린 카드의 글자가 계속 바뀌는 연출을 씁니다. 끄면 정지된 노이즈 글자로 표시합니다(은폐는 그대로 유지). 개인 설정입니다.
    rollBreakdownExpandedName: 굴림 카드 주사위 상세 기본 펼침
    rollBreakdownExpandedHint: /r 굴림과 시트 판정 카드의 주사위 상세 내역을 펼친 상태로 표시합니다. 카드를 클릭하면 접을 수 있습니다. 개인 설정입니다.
    sheetTooltipsName: 시트 툴팁
    sheetTooltipsHint: 시트 항목에 규칙 설명 툴팁을 표시합니다. 개인 설정입니다.
    nightmodeName: 시트 야간 모드
    nightmodeHint: 시트 색상을 어두운 야간 모드로 바꿉니다. 개인 설정입니다.
    compactModeName: 시트 소형 모드
    compactModeHint: 캐릭터 시트를 작게 줄여 표시합니다. 개인 설정입니다.
    lifecycleHooks:
      title: Lifecycle Hooks
      hint: <p>These macros will run on this character's owner's client. If that player is not logged in, they will not be executed.</p><p>In the body, available arguments are <code>this</code>, <code>speaker</code>, <code>actor</code>, and <code>archmage</code>.</p>
