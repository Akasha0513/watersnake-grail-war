<div class="grail-roll-dialog-body" style="display:flex;flex-direction:column;gap:8px;">

	{{#if abilitySelect}}
	<fieldset>
		<legend>능력치</legend>
		<div style="display:flex;flex-wrap:wrap;gap:4px 12px;">
			<label class="grd-radio"><input type="radio" name="ability" value="" {{#unless selectedAbility}}checked{{/unless}}> — 없음 —</label>
			{{#each abilities}}
			<label class="grd-radio"><input type="radio" name="ability" value="{{key}}" {{#if checked}}checked{{/if}}> {{bonus}} {{label}}</label>
			{{/each}}
		</div>
	</fieldset>
	{{/if}}

	{{#if hasBackgrounds}}
	<fieldset>
		<legend>배경 (여러 개 합산)</legend>
		{{#each backgrounds}}
		<div style="display:flex;align-items:center;gap:8px;">
			<label style="flex:1;display:flex;align-items:center;gap:4px;"><input type="checkbox" name="bg-{{key}}" {{#if checked}}checked{{/if}}> {{bonus}} {{label}}</label>
			<label style="flex:0 0 auto;display:flex;align-items:center;gap:3px;white-space:nowrap;"><input type="checkbox" name="bgrand-{{key}}" {{#if random}}checked{{/if}}> 난수</label>
		</div>
		{{/each}}
	</fieldset>
	{{/if}}

	<fieldset>
		<legend>수정치</legend>
		<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;">
			{{#each modifiers}}
			<li style="display:flex;align-items:center;gap:6px;">
				<label style="flex:1;display:flex;align-items:center;gap:5px;"><input type="checkbox" name="mod-{{@index}}" {{#if active}}checked{{/if}}> <span>{{label}}</span> <span style="opacity:0.7;">{{value}}</span></label>
				<a data-action="removeMod" data-index="{{@index}}" title="삭제"><i class="fas fa-times"></i></a>
			</li>
			{{else}}
			<li style="opacity:0.5;font-style:italic;">추가 수정치 없음</li>
			{{/each}}
		</ul>
		<div style="display:flex;gap:4px;margin-top:4px;">
			<input type="text" class="new-mod-label" placeholder="이름" style="flex:1;">
			<input type="text" class="new-mod-value" placeholder="+2 / 1d6 / @x" style="flex:1;">
			<button type="button" data-action="addMod" style="flex:0 0 auto;"><i class="fas fa-plus"></i></button>
		</div>
		<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
			{{#each presets}}
			<button type="button" data-action="addPreset" data-preset="{{id}}" style="flex:0 0 auto;">{{label}}</button>
			{{/each}}
		</div>
	</fieldset>

	<fieldset>
		<legend>옵션</legend>
		<div class="form-group"><label>상황 보정</label><input type="text" name="situational" value="{{situational}}" placeholder="예: +1d4"></div>
		<div class="form-group"><label>대성공 범위 확장</label><input type="number" name="critExpand" value="{{critExpand}}" min="0"></div>
		<div class="form-group"><label>롤 모드</label><select name="rollMode">{{selectOptions rollModes selected=rollMode localize=true}}</select></div>
		<div class="form-group"><label>공식</label><code style="flex:1;padding:2px 4px;opacity:0.85;word-break:break-all;">{{formula}}</code></div>
	</fieldset>

	<footer style="display:flex;gap:4px;">
		<button type="submit" name="selection" value="dis2" style="flex:1;">불리 2</button>
		<button type="submit" name="selection" value="dis1" style="flex:1;">불리 1</button>
		<button type="submit" name="selection" value="normal" style="flex:1;" autofocus>굴림</button>
		<button type="submit" name="selection" value="adv1" style="flex:1;">유리 1</button>
		<button type="submit" name="selection" value="adv2" style="flex:1;">유리 2</button>
	</footer>
</div>
