<form class="ability-config-dialog" style="width:100%; box-sizing:border-box;">
	<style>
		.ability-config-dialog table { table-layout: fixed; }
		.ability-config-dialog input,
		.ability-config-dialog select { box-sizing: border-box; max-width: 100%; }
	</style>
	<table style="width:100%; border-collapse:collapse;">
		<thead>
			<tr>
				<th style="text-align:left;">능력치</th>
				<th>숫자</th>
				<th>＋ / －</th>
				<th>상시 보정</th>
			</tr>
		</thead>
		<tbody>
			{{#each abilities as |abil|}}
			<tr>
				<td style="text-align:left; white-space:nowrap; padding:2px 6px;">{{abil.label}}</td>
				<td style="text-align:center;"><input type="number" name="value_{{abil.key}}" value="{{abil.value}}" style="width:4.5em;"/></td>
				<td style="text-align:center;">
					<select name="reroll_{{abil.key}}">
						{{#each abil.rerollOptions as |opt|}}
						<option value="{{opt.value}}" {{#if opt.selected}}selected{{/if}}>{{opt.label}}</option>
						{{/each}}
					</select>
				</td>
				<td style="text-align:center;"><input type="number" name="flat_{{abil.key}}" value="{{abil.flatBonus}}" style="width:4.5em;"/></td>
			</tr>
			{{/each}}
			<tr>
				<td style="text-align:left; white-space:nowrap; padding:2px 6px;">{{npLabel}}</td>
				<td style="text-align:center;"><input type="number" name="np_value" value="{{npValue}}" style="width:4.5em;"/></td>
				<td></td>
				<td style="text-align:center;"><input type="number" name="np_flat" value="{{npFlat}}" style="width:4.5em;"/></td>
			</tr>
		</tbody>
	</table>
	<p class="notes" style="margin-top:0.6rem; font-size:0.85em; opacity:0.8;">
		＋/－ : 능력치 옆 재굴림 표기(－ / ＋ / ＋＋). 상시 보정: 예장·마스터 패러미터 등으로 능력치 수치에 상시 더해지는 값(수정치·HP·MP·SP·방어에 반영).
	</p>
</form>
