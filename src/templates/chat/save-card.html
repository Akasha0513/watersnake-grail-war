<div class="archmage chat-card grail-roll-card">
  <header class="card-header flexrow">
    <img src="{{actor.img}}" title="{{actor.name}}" width="36" height="36"/>
    <h3 class="ability-usage ability-usage--recharge">{{saveType}}</h3>
  </header>
  <div class="card-content">
    <div class="dice-roll">
      <div class="dice-result">
          <div class="dice-formula">{{data.roll.formula}} >= {{target}}</div>
          <div class="dice-tooltip">
            <section class="tooltip-part">
              <div class="dice">
                  <header class="part-header flexrow">
                      <span class="part-formula">{{data.roll.formula}}</span>             
                      <span class="part-total">{{data.roll.total}}</span>
                  </header>
                  <ol class="dice-rolls">
                    {{#each data.roll.terms as |term i|}}
                      <li class="roll die d{{term.faces}}">{{term.total}}</li>
                    {{/each}}
                  </ol>
              </div>
            </section>
          </div>
          <h4 class="dice-total">{{data.roll.total}}</h4>
      </div>
    </div>
    <div class="card-row" style="padding-top: 5px;">
      <div class="card-prop">
        {{#if success}}
        <span class="grail-result is-success">{{localize 'ARCHMAGE.SAVE.success'}}</span>
        {{else}}
        <span class="grail-result is-failure">{{localize 'ARCHMAGE.SAVE.failure'}}</span>
        {{/if}}
      </div>
    </div>
  </div>
</div>
