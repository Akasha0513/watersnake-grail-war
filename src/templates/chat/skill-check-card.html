<div class="archmage chat-card swade-card ability-card">
  <header class="card-header flexrow">
    <h3 class="item-name">{{ability.name}} {{numberFormat ability.bonus decimals=0 sign=true}}</h3>
  </header>
  <div class="card-content">
    {{#if background.name}}
      <div class="container"><strong>{{background.name}}</strong></div>
    {{/if}}
    {{{rollHTML}}}
  </div>
</div>
